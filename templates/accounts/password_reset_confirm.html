{% extends "base.html" %}
{% block content %}
{% if validlink %}
<form class="auth" method="post" novalidate>
  {% csrf_token %}
  <h1>Choose a new password</h1>
  {% for field in form %}{% include "accounts/_field.html" %}{% endfor %}
  <button class="btn btn-primary btn-block" type="submit">Save password</button>
</form>
{% else %}
<div class="auth"><h1>This link has expired</h1><p><a href="{% url 'accounts:password_reset' %}">Ask for a new one</a>.</p></div>
{% endif %}
{% endblock %}
