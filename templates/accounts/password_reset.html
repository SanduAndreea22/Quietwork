{% extends "base.html" %}
{% block title %}Reset your password · Quietwork{% endblock %}
{% block content %}
<form class="auth" method="post" novalidate>
  {% csrf_token %}
  <h1>Reset your password</h1>
  <p class="muted">Enter the email you signed up with and we'll send you a link.</p>
  {% for field in form %}{% include "accounts/_field.html" %}{% endfor %}
  <button class="btn btn-primary btn-block" type="submit">Send the link</button>
</form>
{% endblock %}
